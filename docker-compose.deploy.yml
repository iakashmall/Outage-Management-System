# Full OMS stack for a server: database, cache, backend and web app, all in Docker.
# Web app on https://<server>:8443 (Caddy). Crew app: http://<server>:4000 (API) and :18080 (sign-in, via Caddy).
# Required in the environment (no defaults): OMS_DB_PASSWORD, OMS_KC_ADMIN_PASSWORD. See deploy/ubuntu/DEPLOY.md.
#   docker compose -f docker-compose.deploy.yml up -d --build
#   docker compose -f docker-compose.deploy.yml run --rm oms-backend node src/infra/seed.js   # first time only
name: oms

# Every service keeps at most 3 x 10 MB of container logs (Docker's default json-file driver never rotates).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: timescale/timescaledb-ha:pg16
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: oms
      POSTGRES_USER: oms
      POSTGRES_PASSWORD: ${OMS_DB_PASSWORD:?set a strong password in the environment}
    volumes:
      # timescaledb-ha's real data dir; /var/lib/postgresql/data would leave the
      # database in the container layer (lost on recreate).
      - pgdata:/home/postgres/pgdata/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oms"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    # The image's own command was a bare "redis-server" (no flags), so only the memory cap is added. volatile-lru
    # evicts only keys with a TTL (the cache:* entries); tag:* keys have none, so a full Redis rejects tag writes,
    # and setTag (backend/src/infra/redis.js) logs that and carries on.
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redisdata:/data

  # Login server. Browsers reach its login pages through Caddy on https :8443, and the crew app through Caddy on
  # http :18080; both pass only the oms-upcl realm. The admin console is on this server only (127.0.0.1:18081).
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    restart: unless-stopped
    logging: *logging
    command: ["start-dev", "--http-port=8080", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${OMS_KC_ADMIN_PASSWORD:?set a strong password in the environment}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: oms
      KC_DB_PASSWORD: ${OMS_DB_PASSWORD:?set a strong password in the environment}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded   # login pages are reached through Caddy (https)
    ports:
      - "127.0.0.1:18081:8080"   # admin console, this server only: ssh -L 18081:127.0.0.1:18081 <user>@<server>
    volumes:
      - ./infra/keycloak-realm.deploy.json:/opt/keycloak/data/import/realm.json:ro
      - ./infra/keycloak-theme/gridq:/opt/keycloak/themes/gridq:ro
    depends_on:
      postgres: { condition: service_healthy }

  # In-house map server: it listens on 127.0.0.1:8095 of this server, so the OMS reaches it the way any other device
  # does, through the tunnel-only SSH login (mapdev). Needs a key: see deploy/ubuntu/DEPLOY.md, "Map server".
  map-tunnel:
    build: ./deploy/map-tunnel
    restart: unless-stopped
    logging: *logging
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./deploy/map-tunnel/keys:/keys:ro

  oms-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    logging: *logging
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_started }
    environment:
      PORT: "4000"
      DATABASE_URL: postgres://oms:${OMS_DB_PASSWORD:?set a strong password in the environment}@postgres:5432/oms
      REDIS_URL: redis://redis:6379
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/oms-upcl/protocol/openid-connect/certs
      EVENT_BUS_DRIVER: memory
      CORS_ORIGIN: "*"
      CUSTOMERS_SERVED: "18500"
      ENABLE_SIMULATORS: "false"   # keep off: /complaints/simulate and /scada/simulate answer 404
      SIMULATOR: "off"   # the simulator mixes fake crew GPS, alarms and calls into real data
      MAP_SERVER_URL: http://map-tunnel:8095
      OMS_PUBLIC_URL: https://${OMS_HOST:-localhost}:8443
      # Database pool (backend/src/infra/db.js): a request that can't get a connection in 5 s gets a JSON 503
      # instead of hanging; no query or open transaction may hold a connection longer than 60 s.
      PG_CONNECT_TIMEOUT_MS: "5000"
      PG_STATEMENT_TIMEOUT_MS: "60000"
      PG_IDLE_TX_TIMEOUT_MS: "60000"
    ports:
      # Crew app API: http://<server>:4000/api (job status, photos, QR scans). The web app goes through Caddy instead.
      # Limit it in the firewall to the crew devices' network if you can; traffic is not encrypted.
      - "4000:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets the backend reach a map server running on the server itself
    volumes:
      # Road graph for crew directions (roads.json + manifest.json), built with npm run roads:build.
      # Optional: without it the crew app draws a straight line to the site. See deploy/ubuntu/DEPLOY.md.
      - ./backend/tiles:/app/backend/tiles:ro
    env_file:
      - path: ./backend/.env.deploy   # optional extras: MAP_*, BREVO_*, NOTIFY_*, REPORT_*
        required: false

  oms-web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_BASEMAP_FALLBACK: osm
        VITE_KEYCLOAK_URL: https://${OMS_HOST:-localhost}:8443
    restart: unless-stopped
    logging: *logging
    depends_on:
      - oms-backend
    ports:
      - "127.0.0.1:${OMS_WEB_PORT:-8080}:80"   # this server only (health checks); users come in through Caddy :8443

  # HTTPS on :8443 (self-signed). Needed because browsers only allow the login library on https or localhost.
  oms-caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      OMS_HOST: ${OMS_HOST:-localhost}
    ports:
      - "8443:8443"
      - "18080:18080"   # crew app sign-in (oms-upcl realm only)
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      - oms-web
      - keycloak

volumes:
  caddydata:
  pgdata:
  redisdata:
