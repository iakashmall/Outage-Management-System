# Production topology sketch (SDP stack). Not required for `npm start` — that runs on SQLite +
# an in-process bus with zero infra. This file shows where the real services attach; the code
# seams for each are documented in docs/ARCHITECTURE.md.
version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: oms
      POSTGRES_USER: oms
      POSTGRES_PASSWORD: oms
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  timescale:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: oms
      POSTGRES_PASSWORD: oms
    ports: ["5433:5432"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "controller,broker"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
    ports: ["9092:9092"]

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: ["start-dev"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports: ["8080:8080"]

  # backend:
  #   build: ./backend
  #   environment:
  #     DATABASE_URL: postgres://oms:oms@postgres:5432/oms
  #     KAFKA_BROKERS: kafka:9092
  #     REDIS_URL: redis://redis:6379
  #   depends_on: [postgres, kafka, redis]
  #   ports: ["4000:4000"]

volumes:
  pgdata:
