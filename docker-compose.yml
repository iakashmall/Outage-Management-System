# One Postgres image that ALSO has TimescaleDB + PostGIS, so the app's single
# DATABASE_URL keeps working and the historian lives in the same database.
# Run:  docker compose up -d

services:

  # Postgres 16 + PostGIS + TimescaleDB in one image.
  # The app's existing DATABASE_URL (postgres://oms:oms@localhost:5432/oms) works as-is.
  postgres:
    image: timescale/timescaledb-ha:pg16
    container_name: oms-postgres
    environment:
      POSTGRES_DB: oms
      POSTGRES_USER: oms
      POSTGRES_PASSWORD: oms
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oms"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Streaming replica of oms-postgres. On first start, this container clones
  # the primary's entire data directory via pg_basebackup, then continuously
  # streams every subsequent change over the replication connection we
  # configured on the primary. If oms-postgres genuinely goes down, this
  # replica already has (near) all its data and can be promoted to take over
  # -- see docs/REPLICATION.md for the promotion procedure.
  postgres-replica:
    image: timescale/timescaledb-ha:pg16
    container_name: oms-postgres-replica
    environment:
      POSTGRES_PASSWORD: oms   # only used if the entrypoint needs it; real auth is via replicator
      PGUSER: replicator
      PGPASSWORD: repl_pass_2026
    ports: ["5433:5432"]   # 5433 locally so it doesn't clash with the primary on 5432
    volumes:
      - pgdata_replica:/home/postgres/pgdata/data
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: >
      bash -c "
      if [ ! -s /home/postgres/pgdata/data/PG_VERSION ]; then
        echo 'No existing data -- cloning primary via pg_basebackup...';
        rm -rf /home/postgres/pgdata/data/*;
        pg_basebackup -h postgres -U replicator -D /home/postgres/pgdata/data -Fp -Xs -P -R;
        chmod 700 /home/postgres/pgdata/data;
      else
        echo 'Existing replica data found -- skipping clone, resuming streaming.';
      fi;
      exec docker-entrypoint.sh postgres
      "
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oms"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: oms-redis
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.7.1
    container_name: oms-kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
    volumes: ["kafkadata:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Browse Kafka topics/messages at http://localhost:8085
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: oms-kafka-ui
    ports: ["8085:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: oms-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on: [kafka]

  # Keycloak admin console at http://localhost:8081  (admin / admin)
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: oms-keycloak
    command: ["start-dev", "--http-port=8080"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: oms
      KC_DB_PASSWORD: oms
    ports: ["8080:8080"]
    volumes:
      - ./infra/keycloak-theme/gridq:/opt/keycloak/themes/gridq
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  pgdata_replica:
  redisdata:
  kafkadata: