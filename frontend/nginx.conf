server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip the usual suspects -- JS/CSS bundles compress well, images don't.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA fallback: try the real file first, then fall back to index.html
    # so React Router handles the route client-side instead of a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache the hashed asset bundle Vite produces (filenames change on
    # every build, so caching forever is safe), but never cache index.html
    # itself -- otherwise a deploy won't show up until the cache expires.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store";
    }
}
