
# Extends Keycloak's built-in "keycloak" login theme rather than replacing
# it — we inherit every template, form, and translation as-is, and only add
# our own stylesheet on top. This is the low-risk way to reskin Keycloak:
# no FTL templates to maintain, no risk of breaking login/registration/MFA
# flows if Keycloak updates its internals later.
parent=keycloak
import=common/keycloak
styles=css/gridq-login.css
scripts=js/gridq-scene.js