name: OMS CI

# Runs on every push and pull request -- catches real breakage (a failing
# self-test, a Dockerfile that no longer builds) before it reaches anyone
# else's machine, rather than everyone discovering it independently.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ────────────────────────────────────────────────────────────────
  # Runs the backend's real self-test (src/selftest.js) against genuine
  # Postgres, Redis, and Kafka service containers -- mirroring
  # docker-compose.yml as closely as possible, so a pass here means the
  # same thing a pass on your own machine means.
  # ────────────────────────────────────────────────────────────────
  test-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_DB: oms
          POSTGRES_USER: oms
          POSTGRES_PASSWORD: oms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      kafka:
        image: apache/kafka:3.7.1
        ports: ["9092:9092"]
        env:
          KAFKA_NODE_ID: "1"
          KAFKA_PROCESS_ROLES: "broker,controller"
          KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
          KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
          KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
          KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
          KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # --legacy-peer-deps: same real conflict between the mobile app's
      # Expo/React Native peer-dependency ranges and the web frontend's
      # Vite ones that we resolve locally every time -- this is a genuine
      # property of this shared-lockfile workspace, not a CI-only quirk.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Wait for Kafka to be genuinely ready
        run: |
          for i in $(seq 1 30); do
            nc -z localhost 9092 && echo "Kafka is up" && exit 0
            echo "Waiting for Kafka... ($i/30)"
            sleep 2
          done
          echo "Kafka never became reachable" && exit 1

      - name: Run backend self-test
        working-directory: backend
        env:
          DATABASE_URL: postgres://oms:oms@localhost:5432/oms
          REDIS_URL: redis://localhost:6379
          KAFKA_BROKERS: localhost:9092
        run: node src/selftest.js

      # OMS-01 planned outages: switching order, permits, safety log, SCADA/DMS
      # guards, crew-app offline rules, and fault jobs unchanged.
      - name: Run OMS-01 self-test
        working-directory: backend
        env:
          DATABASE_URL: postgres://oms:oms@localhost:5432/oms
          REDIS_URL: redis://localhost:6379
          KAFKA_BROKERS: localhost:9092
        run: node src/selftest-oms01.js

      # OMS-03 workload balancing: engine unit tests, then the API flow
      # (propose/apply, off-shift redistribution, NOT_YOUR_JOB, append-only log).
      - name: Run OMS-03 engine unit tests
        working-directory: backend
        run: node --test src/domain/rebalance.test.js

      # Async route errors reach the error middleware as JSON 500 / 503 (no
      # services needed); Redis tag and cache writes never throw (needs Redis).
      - name: Run error handling and Redis write tests
        working-directory: backend
        env:
          REDIS_URL: redis://localhost:6379
        run: node --test src/routes/errors.test.js src/routes/intake.test.js src/infra/redisTag.test.js

      # Intake hardening (runbook WP3): 413 / 400 / 401 / 403 / 404 / 429 through
      # the real requireAuth (local JWKS) and routes.
      - name: Run intake hardening self-test
        working-directory: backend
        env:
          DATABASE_URL: postgres://oms:oms@localhost:5432/oms
          REDIS_URL: redis://localhost:6379
        run: node src/selftest-intake-hardening.js

      # CUSTOMERS_SERVED setting: indices divide by it, "assumed" until confirmed (no services needed).
      - name: Run customers-served setting test
        working-directory: backend
        run: node --test src/domain/indices.test.js

      # Database pool: settings from the environment, and a full pool answers
      # JSON 503 instead of hanging. Only SELECT / SHOW.
      - name: Run database pool self-test
        working-directory: backend
        env:
          DATABASE_URL: postgres://oms:oms@localhost:5432/oms
        run: node src/selftest-pool.js

      - name: Run OMS-03 self-test
        working-directory: backend
        env:
          DATABASE_URL: postgres://oms:oms@localhost:5432/oms
          REDIS_URL: redis://localhost:6379
          KAFKA_BROKERS: localhost:9092
        run: node src/selftest-oms03.js

      # Map forwarder: /api/map allowlist, traversal, export rules, header
      # hygiene, map server down. Uses a fake map server; no real one needed.
      - name: Run map forwarder self-test
        working-directory: backend
        env:
          DATABASE_URL: postgres://oms:oms@localhost:5432/oms
          REDIS_URL: redis://localhost:6379
          KAFKA_BROKERS: localhost:9092
        run: node src/selftest-map.js

      # OMS-03 crew job workflow: status ladder and replays, ownership, lock,
      # undo, return for correction, planned-outage jobs untouched.
      - name: Run crew job workflow self-test
        working-directory: backend
        env:
          DATABASE_URL: postgres://oms:oms@localhost:5432/oms
          REDIS_URL: redis://localhost:6379
          KAFKA_BROKERS: localhost:9092
        run: node src/selftest-jobs.js

      # OMS-03 daily work orders: start / end of day, replays, ownership,
      # end-of-day snapshot, and the crew app payloads the server accepts.
      - name: Run daily work order self-test
        working-directory: backend
        env:
          DATABASE_URL: postgres://oms:oms@localhost:5432/oms
          REDIS_URL: redis://localhost:6379
          KAFKA_BROKERS: localhost:9092
        run: node src/selftest-workorders.js

      # Feeder KPIs (domain/feederKpi.js): hand-worked numbers, no DB needed.
      - name: Run feeder KPI self-test
        working-directory: backend
        env:
          DATABASE_URL: postgres://oms:oms@localhost:5432/oms
          REDIS_URL: redis://localhost:6379
          KAFKA_BROKERS: localhost:9092
        run: node src/selftest-feederkpi.js

      # Burst-safe intake (runbook v2 WP1, G1-G5): one incident per feeder under
      # concurrent SCADA events and complaints, external_id idempotency, retry,
      # rollback. Reseeds the database.
      - name: Run burst-safe intake self-test
        working-directory: backend
        env:
          DATABASE_URL: postgres://oms:oms@localhost:5432/oms
          REDIS_URL: redis://localhost:6379
        run: node src/selftest-intake.js

      # Durable intake queue (WP2, G6-G8): kill the worker mid-burst of 5,000,
      # exactly once after restart; poison -> dead letter; depth on /api/health.
      - name: Run intake queue self-test
        working-directory: backend
        env:
          DATABASE_URL: postgres://oms:oms@localhost:5432/oms
          REDIS_URL: redis://localhost:6379
        run: node src/selftest-queue.js

      # Worker split (WP4): ROLE=api / worker / all as real processes.
      - name: Run worker split self-test
        working-directory: backend
        env:
          DATABASE_URL: postgres://oms:oms@localhost:5432/oms
          REDIS_URL: redis://localhost:6379
        run: node src/selftest-roles.js

      # Load-test fixes (F1-F6): collision-proof alarm ids, SCADA idempotency,
      # cached health, fail-fast Redis, batched queue, complaint lane.
      - name: Run load fixes self-test
        working-directory: backend
        env:
          DATABASE_URL: postgres://oms:oms@localhost:5432/oms
          REDIS_URL: redis://localhost:6379
        run: |
          node --test src/infra/redisFailFast.test.js
          node src/selftest-loadfixes.js

      # D1: schema-versioned startup; a restart under load runs no DDL that
      # deadlocks with inserts, and id counters never rewind.
      - name: Run startup self-test
        working-directory: backend
        env:
          DATABASE_URL: postgres://oms:oms@localhost:5432/oms
          REDIS_URL: redis://localhost:6379
        run: node src/selftest-startup.js

      # D2: no silent deletes; duplicates kept in intake_duplicates; 409 on a
      # dead-lettered item.
      - name: Run intake verdicts self-test
        working-directory: backend
        env:
          DATABASE_URL: postgres://oms:oms@localhost:5432/oms
          REDIS_URL: redis://localhost:6379
        run: node src/selftest-verdicts.js

      # D3: 10 s lease with heartbeat and claim token (G13).
      - name: Run queue lease self-test
        working-directory: backend
        env:
          DATABASE_URL: postgres://oms:oms@localhost:5432/oms
          REDIS_URL: redis://localhost:6379
        run: node src/selftest-lease.js

      # G10/G11 light: 3 + 3 SIGKILL restarts of the worker and the API at
      # 200 SCADA/s and 40 complaints/s. Regression test for the restart
      # deadlock and the qid counter rewind. Fixed ports 4101/4102, sender
      # capped at 300 in flight, no duration assertions. The full profile
      # (npm run test:restarts:full, 10 + 10 at 1,000/200) is not run in CI.
      - name: Run restarts under load self-test (light)
        working-directory: backend
        timeout-minutes: 5
        env:
          DATABASE_URL: postgres://oms:oms@localhost:5432/oms
          REDIS_URL: redis://localhost:6379
          PORT: "4101"
        run: node src/selftest-restarts.js

      # The main self-test again on the same database, now holding planned
      # outages and safety-log rows: seed --force must still reset it.
      - name: Re-run self-test after OMS-01 data exists
        working-directory: backend
        env:
          DATABASE_URL: postgres://oms:oms@localhost:5432/oms
          REDIS_URL: redis://localhost:6379
          KAFKA_BROKERS: localhost:9092
        run: node src/selftest.js

  # ────────────────────────────────────────────────────────────────
  # Builds both Docker images to prove they still build cleanly on every
  # push -- the same two builds we proved work by hand, now automatic.
  # Pushes to GitHub Container Registry (ghcr.io), which needs no extra
  # secrets -- GITHUB_TOKEN already has permission to publish here.
  # Images are tagged with the commit SHA always, and additionally
  # "latest" only when the push is to the default branch, so in-progress
  # branch builds never silently become what "latest" points to.
  # ────────────────────────────────────────────────────────────────
  build-images:
    runs-on: ubuntu-latest
    needs: test-backend
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - name: backend
            dockerfile: backend/Dockerfile
          - name: frontend
            dockerfile: frontend/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        id: tags
        shell: bash
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/oms-${{ matrix.name }}"
          TAGS="${IMAGE}:${{ github.sha }}"
          if [ "${{ github.ref }}" = "refs/heads/master" ]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
